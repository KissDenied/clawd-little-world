<!doctype html>
<html lang="zh-CN" data-theme="liquid-glass">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Clawd 输入框小世界</title>
 <link rel="stylesheet" href="./demo.css">
 <link rel="stylesheet" href="./styles/composer-clawd.css">
 <link rel="stylesheet" href="./styles/clawd-world-options.css">
 <link rel="stylesheet" href="./styles/composer-clawd-activities.css">

</head>
<body><main class="hubby-page">
 <header class="demo-intro"><h1>Clawd 输入框小世界</h1><p>一只住在输入框边上的小 Clawd。</p><p>参考 <a href="https://x.com/xiaochuan_0196">xiaochuan 老师</a>的 <a href="https://github.com/tanlu9410-beep/xiexie-calendar">蟹蟹日历</a> · 非官方同人作品</p></header>
 <div class="demo-messages" aria-live="polite"><p>拖住输入框上沿往上拉，打开它的小房间。也可以抓住 Clawd 拖动。</p></div>
 <p class="demo-config"><label>空白占位数量 <input id="control-count" type="number" min="0" max="20" value="4"></label> · <a href="./gallery.html">查看全部动画</a></p>
 <form class="demo-composer" aria-label="演示输入框">
  <div class="composer-field"><textarea name="message" rows="1" aria-label="消息" placeholder="写点什么…"></textarea></div>
  <div class="demo-controls" aria-label="可自定义的空白图标占位"></div>
 </form>
 <p class="demo-note">28 个动作 · 占位可增减，图标与位置由接入方决定 · 这里只在本机演示，不连接 AI 或发送数据。</p>
</main><script type="module" src="./demo.js"></script></body></html>
